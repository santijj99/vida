spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 300000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        hbm2ddl:
          auto: none

  sql:
    init:
      mode: never

server:
  tomcat:
    connection-timeout: 60s
    keep-alive-timeout: 30s

logging:
  level:
    org.hibernate.orm.deprecation: ERROR

afip:
  enabled: false
  validar-token-en-login: false
