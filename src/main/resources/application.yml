server:
  port: 3000
  address: 192.168.1.14

spring:
  application:
    name: apirest

  datasource:
    url: jdbc:postgresql://localhost:5433/db_punto
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect