server:
  port: ${PORT:3000}
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-before-production-min-32-chars}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  security:
    allow-public-register: true

spring:
  application:
    name: apirest

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_punto}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    org.springframework.boot: INFO
    com.vida.apirest.ApirestApplication: INFO
    com.vida.apirest: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.orm.deprecation: ERROR
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN

